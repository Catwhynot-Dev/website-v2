<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skull Anatomy Quiz</title>
  <link rel="stylesheet" href="/css/quiz.css" />
</head>
<body>
  <div class="wrap">
    <header class="row header">
      <h1>Skull Anatomy — Quiz</h1>
      <div class="row controls">
        <div class="menu">
          <button id="viewBtn" class="btn">View: <span id="viewLabel">anterior</span> ▾</button>
          <div id="viewMenu" class="menu-list" hidden>
            <button class="menu-item" data-view="anterior">Anterior</button>
            <button class="menu-item" data-view="inferior">Inferior</button>
            <button class="menu-item" data-view="lateral">Lateral</button>
          </div>
        </div>
        <button id="modeClick" class="btn primary">Click</button>
        <button id="modeType" class="btn">Type</button>
      </div>
    </header>

    <section class="bar" id="infobar">
      <div id="prompt">Find: <b id="target">—</b> <span id="wrongStreak" class="muted"></span></div>
      <form id="typeForm" class="row" hidden>
        <div>Type the name for the <b>highlighted dot</b>.</div>
        <label class="sr-only" for="answer">Answer</label>
        <input id="answer" class="btn input" placeholder="Type your answer..." />
        <button type="submit" class="btn">Submit</button>
        <span id="typeWrong" class="muted"></span>
      </form>
      <div>Progress: <span id="progress">0/0</span></div>
      <button id="startReview" class="btn review" hidden>Start Review <span id="reviewCount"></span></button>
      <span id="reviewBadge" class="muted" hidden>Review mode</span>
    </section>

    <section id="stage" class="imgbox">
      <img id="bg" alt="Skull view" loading="lazy" />
    </section>

    <details open>
      <summary>Word list (<span id="wordCount">0</span>)</summary>
      <ul id="wordList"></ul>
    </details>
  </div>

  <audio id="good" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
  <audio id="bad" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2953/2953-preview.mp3"></audio>

  <script src="/js/quiz.js"></script>
</body>
</html>
